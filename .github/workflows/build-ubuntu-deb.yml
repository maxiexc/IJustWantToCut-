name: Build and Verify Ubuntu .deb

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Optional Debian package version override (e.g. 0.1.0)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build Ubuntu .deb (22.04 Base)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve package version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VER="${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            BASE_VER="$(python3 -c 'import version; print(version.APP_VERSION)')"
            VER="${BASE_VER}+git${GITHUB_RUN_NUMBER}"
          fi
          echo "Resolved APP_VERSION=${VER}"
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build .deb inside Ubuntu 22.04 container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/ubuntu/Dockerfile
          target: export
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify build output exists
        run: |
          ls -lh dist/
          test -n "$(find dist -maxdepth 1 -name 'ijustwanttocut_*.deb')"
          test -n "$(find dist -maxdepth 1 -name 'ijustwanttocut_*.deb.sha256')"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: ijustwanttocut-ubuntu-deb
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  verify-deb:
    name: Verify on Ubuntu ${{ matrix.ubuntu }}
    needs: build-deb
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v7

      - name: Download .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: ijustwanttocut-ubuntu-deb
          path: dist

      - name: Install, inspect linkage, and smoke-test in Ubuntu ${{ matrix.ubuntu }}
        run: |
          chmod +x packaging/ubuntu/verify_deb.sh
          docker run --rm \
            -v "${PWD}/dist:/pkg:ro" \
            -v "${PWD}/packaging/ubuntu/verify_deb.sh:/verify.sh:ro" \
            "ubuntu:${{ matrix.ubuntu }}" \
            bash /verify.sh

  release:
    name: Publish GitHub Release
    needs:
      - build-deb
      - verify-deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: ijustwanttocut-ubuntu-deb
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.sha256
          body: |
            ## IJustWantToCut ${{ needs.build-deb.outputs.version }}

            ### Ubuntu Installation (22.04 LTS / 24.04 LTS / 26.04 LTS, amd64)

            ```bash
            sudo apt update
            sudo apt install ./ijustwanttocut_${{ needs.build-deb.outputs.version }}_amd64.deb
            ```

            Launch from the desktop application menu (**IJustWantToCut**) or via terminal:

            ```bash
            ijustwanttocut
            ```
