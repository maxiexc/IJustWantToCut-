name: CI (Checks & Tests)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static Checks, Packaging Sanity & Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CI check tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyyaml

      - name: Check Python syntax (py_compile)
        run: |
          python -m py_compile version.py media_processor.py main_ui.py packaging/extract_changelog.py packaging/check_repo.py

      - name: Lint Python code (ruff)
        run: |
          ruff check version.py media_processor.py main_ui.py packaging/extract_changelog.py packaging/check_repo.py

      - name: Run repository, packaging, workflow & changelog checks
        run: |
          python packaging/check_repo.py

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path packaging -Recurse -File -Filter "*.ps1"
          foreach ($s in $scripts) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  throw "PowerShell syntax errors in $($s.FullName): $($errors | Out-String)"
              }
              Write-Host "PowerShell syntax OK: $($s.FullName)"
          }

      - name: Run unit tests (if tests/ exists)
        run: |
          if [ -d "tests" ] && [ -n "$(find tests -name 'test_*.py' -print -quit)" ]; then
            pip install pytest
            pytest -v
          else
            echo "No unit tests found under tests/; skipping pytest."
          fi
