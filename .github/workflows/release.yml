name: Build, Verify, and Release (Ubuntu & Windows)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Optional package version override (e.g. 0.1.0)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-version:
    name: Resolve Release Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve package version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VER="${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            BASE_VER="$(python3 -c 'import version; print(version.APP_VERSION)')"
            VER="${BASE_VER}+git${GITHUB_RUN_NUMBER}"
          fi
          echo "Resolved APP_VERSION=${VER}"
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"

  build-ubuntu-deb:
    name: Build Ubuntu .deb (22.04 Base)
    needs: resolve-version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build .deb inside Ubuntu 22.04 container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/ubuntu/Dockerfile
          target: export
          build-args: |
            APP_VERSION=${{ needs.resolve-version.outputs.version }}
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Ubuntu build output exists
        run: |
          ls -lh dist/
          test -n "$(find dist -maxdepth 1 -name 'ijustwanttocut_*.deb')"
          test -n "$(find dist -maxdepth 1 -name 'ijustwanttocut_*.deb.sha256')"

      - name: Upload Ubuntu .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: ijustwanttocut-ubuntu-deb
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  verify-ubuntu-deb:
    name: Verify Ubuntu .deb (${{ matrix.ubuntu }})
    needs: build-ubuntu-deb
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v7

      - name: Download Ubuntu .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: ijustwanttocut-ubuntu-deb
          path: dist

      - name: Install, inspect linkage, and smoke-test in Ubuntu ${{ matrix.ubuntu }}
        run: |
          chmod +x packaging/ubuntu/verify_deb.sh
          docker run --rm \
            -v "${PWD}/dist:/pkg:ro" \
            -v "${PWD}/packaging/ubuntu/verify_deb.sh:/verify.sh:ro" \
            "ubuntu:${{ matrix.ubuntu }}" \
            bash /verify.sh

  build-windows:
    name: Build Windows Installer & Portable Zip
    needs: resolve-version
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: packaging/windows/requirements-build.txt

      - name: Cache Windows external runtimes (VLC & FFmpeg)
        uses: actions/cache@v5
        with:
          path: build/deps
          key: windows-deps-vlc3.0.21-${{ hashFiles('packaging/windows/fetch_deps.ps1') }}
          restore-keys: |
            windows-deps-vlc3.0.21-

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/windows/requirements-build.txt

      - name: Build Windows onedir, Portable Zip, and Inno Setup installer
        shell: pwsh
        run: |
          .\packaging\windows\build_windows.ps1 -Version "${{ needs.resolve-version.outputs.version }}"

      - name: Verify Windows build outputs exist
        shell: pwsh
        run: |
          Get-ChildItem dist\IJustWantToCut-* | Format-Table Name, Length
          if (-not (Get-ChildItem dist\IJustWantToCut-*-win64-setup.exe)) { throw "Missing setup.exe" }
          if (-not (Get-ChildItem dist\IJustWantToCut-*-win64-portable.zip)) { throw "Missing portable.zip" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ijustwanttocut-windows
          path: |
            dist/IJustWantToCut-*-win64-setup.exe
            dist/IJustWantToCut-*-win64-setup.exe.sha256
            dist/IJustWantToCut-*-win64-portable.zip
            dist/IJustWantToCut-*-win64-portable.zip.sha256
          if-no-files-found: error

  verify-windows:
    name: Verify Windows Installer & Portable Zip
    needs: build-windows
    runs-on: windows-2025
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v7

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: ijustwanttocut-windows
          path: dist

      - name: Verify Portable Zip and Inno Setup install/uninstall
        shell: pwsh
        run: |
          .\packaging\windows\verify_windows.ps1 -DistDir dist

  release:
    name: Publish GitHub Release
    needs:
      - resolve-version
      - build-ubuntu-deb
      - verify-ubuntu-deb
      - build-windows
      - verify-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Ubuntu .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: ijustwanttocut-ubuntu-deb
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: ijustwanttocut-windows
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          body: |
            ## IJustWantToCut ${{ needs.resolve-version.outputs.version }}

            ### Windows Installation (Windows 10 / 11, 64-bit)

            - **Installer (Recommended)**: Download and run `IJustWantToCut-${{ needs.resolve-version.outputs.version }}-win64-setup.exe` (includes bundled FFmpeg & libVLC, no extra setup required).
            - **Portable**: Download `IJustWantToCut-${{ needs.resolve-version.outputs.version }}-win64-portable.zip`, extract, and run `IJustWantToCut\IJustWantToCut.exe`.

            ### Ubuntu Installation (22.04 LTS / 24.04 LTS / 26.04 LTS, amd64)

            ```bash
            sudo apt update
            sudo apt install ./ijustwanttocut_${{ needs.resolve-version.outputs.version }}_amd64.deb
            ```

            Launch from the desktop application menu (**IJustWantToCut**) or via terminal:

            ```bash
            ijustwanttocut
            ```
