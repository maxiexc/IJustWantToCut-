name: Release CD (Build, Verify & Publish)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to build (e.g. 0.1.0; builds & verifies artifacts only, does not publish Release)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-version:
    name: Resolve Release Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve and validate release version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VER="${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            echo "ERROR: Release CD requires a v* Git tag or explicit version input." >&2
            exit 1
          fi

          if ! [[ "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.+-]+)?$ ]]; then
            echo "ERROR: Invalid SemVer version '${VER}' (expected e.g. 0.1.0 or 0.1.0-rc.1)." >&2
            exit 1
          fi

          echo "Resolved APP_VERSION=${VER}"
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"

          python3 packaging/extract_changelog.py --validate
          python3 packaging/extract_changelog.py --version "${VER}" > /dev/null

  build-ubuntu-deb:
    name: Build Ubuntu .deb (22.04 Base)
    needs: resolve-version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build .deb inside Ubuntu 22.04 container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/ubuntu/Dockerfile
          target: export
          build-args: |
            APP_VERSION=${{ needs.resolve-version.outputs.version }}
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Ubuntu build output exists
        run: |
          ls -lh dist/
          test -n "$(find dist -maxdepth 1 -name 'ijustwanttocut_*.deb')"
          test -n "$(find dist -maxdepth 1 -name 'ijustwanttocut_*.deb.sha256')"

      - name: Upload Ubuntu .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: ijustwanttocut-ubuntu-deb
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  verify-ubuntu-deb:
    name: Verify Ubuntu .deb (${{ matrix.ubuntu }})
    needs:
      - resolve-version
      - build-ubuntu-deb
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v7

      - name: Download Ubuntu .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: ijustwanttocut-ubuntu-deb
          path: dist

      - name: Install, inspect linkage, and smoke-test in Ubuntu ${{ matrix.ubuntu }}
        run: |
          chmod +x packaging/ubuntu/verify_deb.sh
          docker run --rm \
            -e EXPECTED_VERSION="${{ needs.resolve-version.outputs.version }}" \
            -v "${PWD}/dist:/pkg:ro" \
            -v "${PWD}/packaging/ubuntu/verify_deb.sh:/verify.sh:ro" \
            "ubuntu:${{ matrix.ubuntu }}" \
            bash /verify.sh

  build-windows:
    name: Build Windows Installer & Portable Zip
    needs: resolve-version
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: packaging/windows/requirements-build.txt

      - name: Cache Windows external runtimes (VLC & FFmpeg)
        uses: actions/cache@v5
        with:
          path: build/deps
          key: windows-deps-vlc3.0.21-${{ hashFiles('packaging/windows/fetch_deps.ps1') }}
          restore-keys: |
            windows-deps-vlc3.0.21-

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/windows/requirements-build.txt

      - name: Build Windows onedir, Portable Zip, and Inno Setup installer
        shell: pwsh
        run: |
          .\packaging\windows\build_windows.ps1 -Version "${{ needs.resolve-version.outputs.version }}"

      - name: Verify Windows build outputs exist
        shell: pwsh
        run: |
          Get-ChildItem dist\IJustWantToCut-* | Format-Table Name, Length
          if (-not (Get-ChildItem dist\IJustWantToCut-*-win64-setup.exe)) { throw "Missing setup.exe" }
          if (-not (Get-ChildItem dist\IJustWantToCut-*-win64-portable.zip)) { throw "Missing portable.zip" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ijustwanttocut-windows
          path: |
            dist/IJustWantToCut-*-win64-setup.exe
            dist/IJustWantToCut-*-win64-setup.exe.sha256
            dist/IJustWantToCut-*-win64-portable.zip
            dist/IJustWantToCut-*-win64-portable.zip.sha256
          if-no-files-found: error

  verify-windows:
    name: Verify Windows Installer & Portable Zip
    needs:
      - resolve-version
      - build-windows
    runs-on: windows-2025
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v7

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: ijustwanttocut-windows
          path: dist

      - name: Verify Portable Zip and Inno Setup install/uninstall
        shell: pwsh
        run: |
          .\packaging\windows\verify_windows.ps1 -DistDir dist -ExpectedVersion "${{ needs.resolve-version.outputs.version }}"

  release:
    name: Publish GitHub Release
    needs:
      - resolve-version
      - build-ubuntu-deb
      - verify-ubuntu-deb
      - build-windows
      - verify-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Ubuntu .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: ijustwanttocut-ubuntu-deb
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: ijustwanttocut-windows
          path: dist

      - name: Compose GitHub Release notes from CHANGELOG.md
        env:
          VER: ${{ needs.resolve-version.outputs.version }}
        run: |
          python3 packaging/extract_changelog.py --version "${VER}" --output release_changelog.md
          {
            printf '## IJustWantToCut v%s\n\n' "${VER}"
            printf '### 更新內容 (Changelog)\n\n'
            cat release_changelog.md
            printf '\n'
            cat <<EOF
          ### Windows 安裝方式（Windows 10 / 11, 64-bit）

          - **安裝版（推薦）**：下載並執行 \`IJustWantToCut-${VER}-win64-setup.exe\`（已內嵌 FFmpeg 與 libVLC，不需額外安裝依賴）。
          - **免安裝可攜版**：下載 \`IJustWantToCut-${VER}-win64-portable.zip\`，解壓縮後執行 \`IJustWantToCut\\IJustWantToCut.exe\`。

          ### Ubuntu 安裝方式（22.04 LTS / 24.04 LTS / 26.04 LTS, amd64）

          \`\`\`bash
          sudo apt update
          sudo apt install ./ijustwanttocut_${VER}_amd64.deb
          \`\`\`

          安裝完成後可從應用程式選單啟動 **IJustWantToCut**，或在終端機執行：

          \`\`\`bash
          ijustwanttocut
          \`\`\`
          EOF
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            dist/*.deb
            dist/*.exe
            dist/*.zip
            dist/*.sha256
