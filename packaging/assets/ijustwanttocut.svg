<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <!-- Film strip frame -->
  <rect x="20" y="28" width="88" height="72" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
  <!-- Sprocket holes top -->
  <rect x="28" y="34" width="10" height="8" rx="2" fill="#94a3b8"/>
  <rect x="46" y="34" width="10" height="8" rx="2" fill="#94a3b8"/>
  <rect x="72" y="34" width="10" height="8" rx="2" fill="#94a3b8"/>
  <rect x="90" y="34" width="10" height="8" rx="2" fill="#94a3b8"/>
  <!-- Sprocket holes bottom -->
  <rect x="28" y="86" width="10" height="8" rx="2" fill="#94a3b8"/>
  <rect x="46" y="86" width="10" height="8" rx="2" fill="#94a3b8"/>
  <rect x="72" y="86" width="10" height="8" rx="2" fill="#94a3b8"/>
  <rect x="90" y="86" width="10" height="8" rx="2" fill="#94a3b8"/>
  <!-- Video play triangle -->
  <polygon points="34,54 34,74 50,64" fill="url(#accent)"/>
  <!-- Cut line -->
  <line x1="64" y1="20" x2="64" y2="108" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Scissors / blades -->
  <line x1="66" y1="64" x2="94" y2="48" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="66" y1="64" x2="94" y2="80" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="96" cy="48" r="7" fill="none" stroke="#f8fafc" stroke-width="3.5"/>
  <circle cx="96" cy="80" r="7" fill="none" stroke="#f8fafc" stroke-width="3.5"/>
  <circle cx="64" cy="64" r="3.5" fill="#38bdf8"/>
</svg>
